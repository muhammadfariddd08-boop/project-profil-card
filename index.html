<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profil card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">

        <div class="info-box">
            <img src="image.jpg" alt="">

            <div class="info">
                <h2>M.faried</h2>
                <P>web developer</P>
            </div>
        </div>

    <div class="number-grid">

        <div class="box">
            <P>150</P>
            <P>post</P>
        </div>

        <div class="box">
            <p>150k</p>
            <p>followers</p>
        </div>

        <div class="box">
            <p>10</p>
            <p>following</p>
        </div>

    </div>

    <div class="btn-box">
        <button class="follow">follow</button>
        <button class="message">message</button>
    </div>

    </div>
    </div>
</body>
</html>
